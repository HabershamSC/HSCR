name: Beaufort County parcel geocalibration

on:
  workflow_dispatch:
  push:
    branches:
      - fix/county-geocalibration
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/county-geocalibration.yml"

jobs:
  geocalibrate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy pyproj shapely

      - name: Run county geocalibration
        run: |
          python scripts/county_geocalibrate.py

      - name: Upload calibration results
        uses: actions/upload-artifact@v4
        with:
          name: HSCR-Beaufort-County-Geocalibration
          path: output/
