name: Beaufort County parcel geocalibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch County GIS and calculate transformations
        run: python scripts/calibrate_to_beaufort.py --faces data/master-parcel-faces.geojson --output output

      - name: Upload QA package
        uses: actions/upload-artifact@v4
        with:
          name: HSCR-Beaufort-County-Geocalibration
          path: output/
